name: 🛡️ Praetorian CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  NPM_VERSION: '9'

jobs:
  # 🔍 Code Quality & Security
  code-quality:
    name: 🔍 Code Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧹 Lint code
        run: npm run lint

      - name: 🔧 Type check
        run: npm run build

  # 🧪 Testing & Coverage
  test:
    name: 🧪 Testing & Coverage
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test -- --coverage --watchAll=false --verbose=false

      - name: 📊 Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true

      - name: 🧬 Mutation Testing
        run: npm run test:mutation
        continue-on-error: true

  # 📦 Build & Package
  build:
    name: 📦 Build & Package
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Build project
        run: npm run build

      - name: 📦 Package size analysis
        run: |
          echo "📊 Bundle size analysis:"
          du -sh dist/
          echo "📁 Directory structure:"
          find dist/ -type f -name "*.js" -exec wc -l {} + | tail -1

  # 🚀 Release (only on main branch)
  release:
    name: 🚀 Release
    runs-on: ubuntu-latest
    needs: [code-quality, test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔧 Build project
        run: npm run build

      - name: 📦 NPM Publish (Manual)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "📦 NPM Publishing is currently DISABLED for manual control"
          echo ""
          echo "🚀 To publish manually:"
          echo "   1. Build: npm run build"
          echo "   2. Test: npm test"
          echo "   3. Publish: npm publish --access public"
          echo ""
          echo "📋 Package: @syntropysoft/praetorian"
          echo "📝 Version: v0.0.4-alpha"
          echo ""
          echo "✅ All checks passed - Ready for manual publishing!"


  # 📊 Security Audit
  security-audit:
    name: 📊 Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Run security audit
        run: npm audit --audit-level=moderate

      - name: 🔒 Check for vulnerabilities
        run: |
          echo "🔍 Running security audit for high-severity vulnerabilities..."
          npm audit --audit-level=high || {
            echo "❌ High-severity vulnerabilities detected"
            echo "📋 Running detailed audit report:"
            npm audit --audit-level=high
            exit 1
          }
          echo "✅ No high-severity vulnerabilities found"
